```svg
<svg width="100%" height="140" viewBox="0 0 1000 140"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ff2bd6"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="inside" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#05070b"/>
    </linearGradient>
  </defs>

  <!-- Glow -->
  <rect x="3" y="3" width="994" height="134" rx="18"
        fill="none"
        stroke="url(#border)"
        stroke-width="5"
        opacity="0.85"
        filter="url(#glow)"/>

  <!-- Main border -->
  <rect x="3" y="3" width="994" height="134" rx="18"
        fill="url(#inside)"
        stroke="url(#border)"
        stroke-width="1.5"/>

  <!-- Side glow accents -->
  <circle cx="8" cy="70" r="4" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="992" cy="70" r="4" fill="#ff2bd6" filter="url(#glow)"/>
</svg>
```
